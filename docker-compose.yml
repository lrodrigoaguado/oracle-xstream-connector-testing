  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.5
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker1
      - broker2
      - broker3
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker1:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  oracle:
    # ARM64 (Apple Silicon M1/M2/M3): use tag 19.19.0.0
    # x86_64  (Intel Mac / Linux):     use tag 19.3.0.0
    image: container-registry.oracle.com/database/enterprise:19.19.0.0
    hostname: oracle
    container_name: oracle-19
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=Welcome1
      - ORACLE_CHARACTERSET=AL32UTF8
      # Name the default PDB SOURCEPDB (the image's default is ORCLPDB1). dbca
      # creates the PDB with this name; SINKPDB is created later by the setup
      # script. Pairing SOURCEPDB/SINKPDB makes the source/target roles explicit.
      - ORACLE_PDB=SOURCEPDB
    volumes:
      - oracle_data:/opt/oracle/oradata
      # The 19c EE image's runUserScripts.sh sources every executable in
      # /opt/oracle/scripts/setup/ AFTER dbca creates the CDB and BEFORE the
      # alert-log tail begins. That is the only context inside this container
      # where SHUTDOWN/STARTUP MOUNT works reliably (the SPFILE created by dbca
      # is in use). Driving the setup via `docker exec` after the container is
      # "running" hits ORA-32001 / ORA-00205 because the SPFILE chain is no
      # longer canonical.
      - ./bin/01_setup_oracle_xstream.sh:/opt/oracle/scripts/setup/01_setup_xstream.sh
      # CREATE_OUTBOUND (in the setup script above) starts the capture +
      # outbound server in the image's initial DB-creation incarnation, but they
      # do NOT survive the image's final handover restart -- they land DISABLED.
      # This startup hook runs on every boot AFTER the final instance is open and
      # (re)starts them. See bin/01b_start_xstream.sh for the full rationale.
      - ./bin/01b_start_xstream.sh:/opt/oracle/scripts/startup/01_start_xstream.sh
    healthcheck:
      test: ["CMD-SHELL", "printf 'WHENEVER SQLERROR EXIT SQL.SQLCODE;\\nSET HEADING OFF FEEDBACK OFF PAGESIZE 0;\\nSELECT status FROM v$$instance;\\nEXIT;\\n' | sqlplus -S -L system/Welcome1@//localhost:1521/ORCLCDB | grep -q OPEN"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 600s

  connect:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LIBAIO_RPM: libaio-0.3.112-1.el8.aarch64.rpm
        INSTANT_CLIENT_RPM: oracle-instantclient-basic-23.26.0.0.0-1.el8.aarch64.rpm
    hostname: connect
    container_name: connect
    depends_on:
      - broker1
      - broker2
      - broker3
      - schema-registry
      - oracle
    ports:
      - "8083:8083"
    volumes:
      - ./etc/confluentinc-kafka-connect-jdbc-10.9.1.zip:/tmp/confluentinc-kafka-connect-jdbc-10.9.1.zip
      - ./smt/target/remove-attribute-with-value-1.0-SNAPSHOT.jar:/usr/share/java/kafka-connect-custom-smt/remove-attribute-with-value-1.0-SNAPSHOT.jar
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker1:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLASSPATH: /usr/share/java/monitoring-interceptors/monitoring-interceptors-7.9.3.jar
      CONNECT_PRODUCER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor"
      CONNECT_CONSUMER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_SNI_HOST_CHECK_ENABLED: false
      KAFKA_OPTS: "-Djava.library.path=/usr/lib/oracle/23/client64/lib"
      LD_LIBRARY_PATH: "/usr/lib/oracle/23/client64/lib"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_PLUGIN_DISCOVERY: "only_scan"
    command:
      - bash
      - -c
      - |
        echo "Installing Connector"
        confluent-hub install --no-prompt confluentinc/kafka-connect-oracle-xstream-cdc-source:1.3.0
        # The XStream SOURCE connector needs the native Instant Client libs + xstreams.jar.
        cp /usr/lib/oracle/23/client64/lib/*.jar /usr/share/confluent-hub-components/confluentinc-kafka-connect-oracle-xstream-cdc-source/lib/
        confluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:latest
        # Do NOT copy the Instant Client jars into the JDBC SINK connector. It uses the
        # pure-Java Oracle thin driver, which it already bundles (ojdbc8-19.7.0.0.jar).
        # Adding the Instant Client ojdbc8.jar (23c) puts a SECOND oracle.jdbc.OracleDriver
        # (with its own META-INF/services/java.sql.Driver) on the same plugin classloader;
        # DriverManager's lazy ServiceLoader scan then aborts on the conflicting provider
        # and registers NO Oracle driver, yielding "No suitable driver found for
        # jdbc:oracle:thin" when the sink connector validates its connection.
        #
        echo "Launching Kafka Connect worker"
        /etc/confluent/docker/run &
        #
        sleep infinity

  prometheus:
    image: confluentinc/cp-enterprise-prometheus:2.2.0
    hostname: cp-enterprise-prometheus
    container_name: prometheus
    volumes:
      - ./vol/config:/mnt/config
    ports:
      - "9090:9090"
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: false

  alertmanager:
    image: confluentinc/cp-enterprise-alertmanager:2.2.0
    hostname: cp-enterprise-alertmanager
    container_name: alertmanager
    depends_on:
      - prometheus
    volumes:
      - ./vol/config:/mnt/config
    ports:
      - "9093:9093"
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: false

  control-center:
    image: confluentinc/cp-enterprise-control-center-next-gen:2.2.0
    hostname: control-center
    container_name: control-center
    depends_on:
      - broker1
      - broker2
      - broker3
      - schema-registry
      - connect
      - prometheus
      - alertmanager
    ports:
      - "9021:9021"
    volumes:
      - ./vol/config:/mnt/config
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker1:29092'
